<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pack verano jugando en inglés - Nivel 2 - Días de la semana</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2350;--a:#ff5fa2;--b:#ffb52e;--c:#2ee6a6;--d:#38bdf8;--e:#a78bfa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 0,#3b1d8f,#140b3d 65%) fixed;min-height:100vh;overflow-x:hidden}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.sky i{position:absolute;bottom:-60px;font-style:normal;opacity:.45;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(360deg)}}
header,nav,main{position:relative;max-width:980px;margin:auto;padding:0 12px}
h1{text-align:center;margin:20px 0 8px;line-height:1.1;font-size:clamp(2.1rem,9vw,4.4rem);letter-spacing:1px}
h1 span{display:inline-block;color:#fff;-webkit-text-stroke:1.5px var(--g);text-shadow:0 0 3px #fff,0 0 8px var(--g),0 0 18px var(--g),0 0 34px var(--g);animation:bob 2.6s ease-in-out infinite}
.t1{--g:#ff3d9a}.t2{--g:#ffc83d;animation-delay:.3s!important}.t3{--g:#2effb0;animation-delay:.6s!important}.t4{--g:#3dc9ff;animation-delay:.9s!important}
@keyframes bob{50%{transform:translateY(-6px)}}
.sub{text-align:center;margin-bottom:6px}
.badge{display:inline-block;color:#fff;font-weight:700;font-size:clamp(1rem,4vw,1.4rem);padding:6px 20px;border-radius:999px;border:3px solid #3dc9ff;box-shadow:0 0 12px #3dc9ff,inset 0 0 10px #3dc9ff66}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px auto}
.tab{font:inherit;display:flex;flex-direction:column;align-items:center;min-width:76px;padding:6px 10px;border:2px solid #fff3;border-radius:16px;background:#ffffff1f;color:#fff;cursor:pointer;transition:transform .2s}
.tab b{font-size:1.5rem;font-weight:500}.tab small{font-size:.75rem;font-weight:700}
.tab:hover{transform:translateY(-3px)}
.tab.on{background:linear-gradient(135deg,var(--a),var(--b));border-color:#fff;box-shadow:0 0 14px var(--a)}
.card{background:#fff;border-radius:28px;padding:18px;margin:12px 0;box-shadow:0 10px 40px #0007;animation:pop .5s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.card h2{margin:0 0 4px;font-size:clamp(1.4rem,5vw,2rem)}
.how{background:#eaf6ff;border-radius:16px;padding:10px 14px;margin:8px 0 14px;font-size:1.05rem;text-align:center}
.prompt{text-align:center;font-size:clamp(1.2rem,5vw,1.7rem);margin:10px 0}
.btn{font:inherit;font-weight:700;font-size:1.05rem;border:0;border-radius:999px;padding:10px 20px;color:#fff;background:linear-gradient(135deg,var(--a),var(--e));cursor:pointer;box-shadow:0 4px 0 #0003;transition:transform .15s}
.btn:active{transform:translateY(3px) scale(.97)}.btn:disabled{opacity:.5}
.btn.g{background:linear-gradient(135deg,#19c98d,var(--d))}.btn.y{background:linear-gradient(135deg,var(--b),var(--a))}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin:10px 0}
.msg{min-height:1.8em;text-align:center;font-weight:700;font-size:1.15rem}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
.opt{font:inherit;font-weight:700;font-size:1.2rem;padding:14px 8px;border:3px solid #e3def5;border-radius:18px;background:#fff;color:var(--ink);cursor:pointer;transition:transform .15s}
.opt:active{transform:scale(.96)}.opt.sel{border-color:var(--d);background:#e3f6ff}
.opt.ok{background:#b9f6d2!important;border-color:#19c98d;color:var(--ink)!important}
.opt.no,.shake{animation:shk .45s}.opt.no{background:#ffd6d6;border-color:#ff6b6b}
@keyframes shk{25%{transform:translateX(-8px) rotate(-2deg)}75%{transform:translateX(8px) rotate(2deg)}}
.vc{font:inherit;display:flex;flex-direction:column;align-items:center;padding:14px 6px;border:3px solid #e3def5;border-radius:22px;background:linear-gradient(#fff,#f6f1ff);cursor:pointer;color:var(--ink)}
.vc span{font-size:2.6rem}.vc b{font-size:1.5rem}.vc small{font-size:1.05rem;color:#6b5fa8}.vc.bump{animation:bump .5s}.vc.hl{background:#fff1b8;border-color:var(--b);transform:scale(1.06)}
@keyframes bump{40%{transform:scale(1.12) rotate(-3deg)}}
.col{display:flex;flex-direction:column;gap:10px;flex:1}.two{display:flex;gap:14px}
.tile{font:inherit;font-weight:700;font-size:1.7rem;width:50px;height:58px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--d),var(--e));color:#fff;cursor:pointer;box-shadow:0 4px 0 #0003}
.tile.on{background:linear-gradient(135deg,var(--b),var(--a))}.ph{color:#8a80b8}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.chip{background:#fff1b8;border-radius:999px;padding:4px 14px;font-weight:700}.chip.done{background:#b9f6d2;text-decoration:line-through;opacity:.7}
.ws{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:460px;margin:auto}
.ws button{aspect-ratio:1;border:0;border-radius:8px;padding:0;font:inherit;font-weight:700;font-size:clamp(.9rem,4.3vw,1.4rem);background:#f1ecff;color:var(--ink);cursor:pointer}
.ws .s{background:var(--b)}.ws .fd{color:#fff}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;margin:auto}
.mem{aspect-ratio:1;perspective:600px;border:0;padding:0;background:none;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}.mem.f .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-weight:700;font-size:clamp(.7rem,3.2vw,1.05rem);text-align:center;color:var(--ink)}
.fr{background:linear-gradient(135deg,var(--a),var(--e));color:#fff;font-size:2rem}
.bk{transform:rotateY(180deg);background:#fff4c4;border:3px solid var(--b)}.bk span{font-size:1.6rem}.mem.m .bk{background:#b9f6d2;border-color:#19c98d}
.stage{--m:0;position:relative;max-width:340px;margin:auto;border-radius:24px;overflow:hidden;background:linear-gradient(#5ec8ff,#c9efff 70%,#fff3c4);box-shadow:0 0 0 4px #fff,0 8px 24px #0004}
.stage svg{display:block;width:100%}
.hot{position:absolute;inset:0;background:radial-gradient(circle at 85% 12%,#ff7a00,#ff3d00 70%);opacity:calc(var(--m)*.09);pointer-events:none;transition:opacity .9s}
.idle{transform-box:fill-box;transform-origin:50% 100%;animation:idle 2.4s ease-in-out infinite}@keyframes idle{50%{transform:rotate(1.5deg) scaleY(1.015)}}
.body{transform-box:fill-box;transform-origin:50% 100%;transform:scale(calc(1 + var(--m)*.03),calc(1 - var(--m)*.13));transition:transform .9s cubic-bezier(.3,1.6,.5,1)}
.band{animation:sweep 3.2s linear infinite}@keyframes sweep{from{transform:translateX(0) skewX(-20deg)}to{transform:translateX(270px) skewX(-20deg)}}
.drip{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(calc(var(--m)*var(--k)));transition:transform 1s}
.puddle{transform-box:fill-box;transform-origin:50% 50%;transform:scale(calc(.15 + var(--m)*.17));transition:transform 1s}
.drops{opacity:calc(var(--m)*.25)}.drops circle{animation:fallx 1.1s ease-in infinite}@keyframes fallx{to{transform:translateY(46px)}}
.ripples{opacity:calc(var(--m)*.25)}.ripples ellipse{fill:none;stroke:#fff;stroke-width:2;transform-box:fill-box;transform-origin:50% 50%;animation:rip 1.4s ease-out infinite}.ripples ellipse:nth-child(2){animation-delay:.7s}
@keyframes rip{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
.sun{transform-box:fill-box;transform-origin:50% 50%;transform:scale(calc(1 + var(--m)*.12));filter:drop-shadow(0 0 calc(4px + var(--m)*3px) #ff9a00);transition:transform .9s}
.rays{transform-box:fill-box;transform-origin:50% 50%;animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.shades{opacity:calc(var(--m) - 2)}
.cloud{animation:drift 16s linear infinite}.cloud.c2{animation-duration:24s;animation-delay:-9s}@keyframes drift{from{transform:translateX(-70px)}to{transform:translateX(270px)}}
.cold{opacity:calc(1 - var(--m)*.18)}.cold circle{animation:puff 2.4s ease-out infinite}.cold circle:nth-child(2){animation-delay:.8s}.cold circle:nth-child(3){animation-delay:1.6s}
@keyframes puff{from{transform:translateY(0);opacity:.9}to{transform:translateY(-28px);opacity:0}}
.shine{animation:tw 2s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
.mood,.spark,.lostface,.rainbow{display:none}
.stage[data-mood=happy] .happy,.stage[data-mood=worry] .worry,.stage[data-mood=scared] .scared,.stage[data-mood=sad] .sad,.stage[data-mood=win] .winf{display:inline}
.sweat{animation:sweat 1s ease-in infinite}@keyframes sweat{from{transform:translateY(0);opacity:1}to{transform:translateY(16px);opacity:0}}
.win .spark{display:block;font-size:22px;animation:tw .6s infinite}.lost .lostface{display:block;font-size:20px}
.win .rainbow{display:inline;stroke-dasharray:320;animation:draw 1.2s ease-out forwards}@keyframes draw{from{stroke-dashoffset:320}to{stroke-dashoffset:0}}
.win svg{animation:dance .55s ease-in-out infinite alternate}@keyframes dance{from{transform:rotate(-4deg)}to{transform:rotate(4deg) scale(1.04)}}
.stage.shake svg{animation:shk .4s}.lost svg{filter:saturate(.55)}
.fwp{position:absolute;width:7px;height:7px;border-radius:50%;box-shadow:0 0 8px #fff;animation:fwp 1s ease-out forwards;pointer-events:none}@keyframes fwp{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.slots span{width:40px;height:48px;border-bottom:5px solid var(--e);font-size:1.9rem;font-weight:700;text-align:center;line-height:48px}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(40px,1fr));gap:6px;max-width:520px;margin:10px auto}
.kb .opt{padding:8px 0;font-size:1.1rem;border-radius:12px}.kb .opt:disabled{opacity:.9}
.final{text-align:center}.final h2{font-size:clamp(1.8rem,7vw,2.8rem)}.stars{font-size:1.8rem;font-weight:700;color:#e08a00}
.foot{display:flex;justify-content:space-between;gap:10px;margin:6px 0 24px}
.cf{position:fixed;top:-40px;z-index:9;pointer-events:none;animation:fall 2.6s ease-in forwards}@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
@media(max-width:480px){.tab{min-width:64px;padding:5px 6px}.two{gap:8px}.opt{font-size:1.05rem}}
</style></head>
<body>
<div class="sky" id="sky"></div>
<header>
  <h1><span class="t1">Pack</span> <span class="t2">verano</span> <span class="t3">jugando</span> <span class="t4">en inglés</span></h1>
  <div class="sub"><span class="badge">⭐ Nivel 2 · Días de la semana ⭐</span></div>
  <div class="sub" style="color:#fff;font-weight:700">⏱️ Duración: 30 minutos</div>
</header>
<nav id="nav" aria-label="Secciones de la clase"></nav>
<main id="main"></main>
<script>
"use strict";
/* ===== Datos ===== */
const DAYS = [["Monday","Lunes","🌙"],["Tuesday","Martes","🔥"],["Wednesday","Miércoles","🌈"],["Thursday","Jueves","⚡"],["Friday","Viernes","🎉"],["Saturday","Sábado","🏖️"],["Sunday","Domingo","☀️"]].map(([en,es,icon]) => ({en,es,icon}));

/* ===== Utilidades ===== */
const $ = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const State = { score: 0, add(n) { this.score += n; } };

/* ===== Servicios: sonido, voz y confeti ===== */
const Sound = {
  ctx: null,
  tone(f, d = .15, t = 0, type = "sine") {
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx; if (c.state === "suspended") c.resume();
      const o = c.createOscillator(), g = c.createGain(), s = c.currentTime + t;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.18, s); g.gain.exponentialRampToValueAtTime(.001, s + d);
      o.connect(g); g.connect(c.destination); o.start(s); o.stop(s + d);
    } catch (e) { /* sin audio disponible */ }
  },
  click() { this.tone(520, .08); },
  drip() { this.tone(900, .1); this.tone(520, .15, .08); this.tone(300, .2, .2, "triangle"); },
  ok() { [523, 659, 784].forEach((f, i) => this.tone(f, .18, i * .1, "triangle")); },
  bad() { this.tone(220, .25, 0, "sawtooth"); this.tone(165, .3, .12, "sawtooth"); },
  win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, .2, i * .12, "triangle")); }
};
const Voice = {
  say(text) {
    return new Promise(res => {
      if (!("speechSynthesis" in window)) return res();
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = .8; u.pitch = 1.1;
      const v = speechSynthesis.getVoices().find(x => /^en[-_]US$/.test(x.lang));
      if (v) u.voice = v;
      u.onend = u.onerror = () => res();
      speechSynthesis.speak(u); setTimeout(res, 2500);
    });
  }
};
if ("speechSynthesis" in window) speechSynthesis.getVoices();
function fireworks(host) {
  ["#ff3d9a", "#ffc83d", "#2effb0", "#3dc9ff"].forEach((col, b) => setTimeout(() => {
    const cx = 20 + Math.random() * 60, cy = 15 + Math.random() * 40;
    for (let k = 0; k < 16; k++) {
      const p = $("i", "fwp"), a = k / 16 * Math.PI * 2, r = 40 + Math.random() * 30;
      p.style.cssText = `left:${cx}%;top:${cy}%;background:${col};--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r}px`;
      host.append(p); setTimeout(() => p.remove(), 1100);
    }
    Sound.tone(300 + b * 150, .12, 0, "square");
  }, b * 350));
}
function confetti() {
  for (let i = 0; i < 40; i++) {
    const s = $("span", "cf", ["🎉","⭐","✨","🍭","🌈","🎈"][i % 6]);
    s.style.cssText = `left:${Math.random() * 100}vw;animation-delay:${Math.random()}s;font-size:${18 + Math.random() * 22}px`;
    document.body.append(s); setTimeout(() => s.remove(), 3400);
  }
}
function celebrate(box) {
  box.innerHTML = "";
  box.append($("h3", "prompt", "🌟 ¡Sección completada! 🌟<br>Toca «Siguiente» para seguir jugando."));
  Sound.win(); confetti(); State.add(3);
}

/* ===== Componente reutilizable: preguntas de opción múltiple ===== */
function multipleChoice(root, questions) {
  let i = 0, sel = null, solved = false;
  const box = $("div"); root.append(box);
  const render = () => {
    const q = questions[i]; sel = null; solved = false; box.innerHTML = "";
    box.append($("div", "how", `Pregunta ${i + 1} de ${questions.length}`), $("h3", "prompt", q.prompt));
    if (q.say) { const l = $("button", "btn y", "🔊 Escuchar"); l.onclick = () => Voice.say(q.say); const r = $("div", "row"); r.append(l); box.append(r); }
    const msg = $("div", "msg"), g = $("div", "grid");
    const btns = q.options.map((t, k) => {
      const b = $("button", "opt", t);
      b.onclick = () => { if (solved) return; sel = k; Sound.click(); btns.forEach((x, j) => x.classList.toggle("sel", j === k)); msg.textContent = ""; };
      return b;
    });
    g.append(...btns);
    const chk = $("button", "btn g", "✔️ Comprobar");
    chk.onclick = () => {
      if (solved) { if (i < questions.length - 1) { i++; render(); } else celebrate(box); return; }
      if (sel === null) { msg.textContent = "👆 Elige una respuesta primero"; return; }
      if (sel === q.answer) {
        solved = true; Sound.ok(); State.add(1); btns[sel].classList.add("ok");
        msg.textContent = "🎉 ¡Muy bien!"; chk.textContent = i < questions.length - 1 ? "➡️ Siguiente pregunta" : "🏆 ¡Terminé!";
      } else {
        const k = sel; sel = null; Sound.bad(); btns[k].classList.add("no"); msg.textContent = "💪 ¡Casi! Inténtalo otra vez";
        setTimeout(() => btns[k].classList.remove("no", "sel"), 600);
      }
    };
    const r = $("div", "row"); r.append(chk); box.append(g, r, msg);
  };
  render();
}
const choicesFor = (d, key) => { const o = shuffle([d, ...pick(DAYS.filter(x => x !== d), 3)]); return { options: o.map(x => x[key]), answer: o.indexOf(d) }; };

/* ===== Secciones ===== */
const vocabulary = root => {
  const g = $("div", "grid"), cards = DAYS.map(d => {
    const c = $("button", "vc", `<span>${d.icon}</span><b>${d.en}</b><small>${d.es}</small><em>🔊</em>`);
    c.onclick = () => { Sound.click(); c.classList.add("bump"); setTimeout(() => c.classList.remove("bump"), 500); Voice.say(d.en); };
    return c;
  });
  g.append(...cards);
  const song = $("button", "btn y", "🎵 Escuchar todos los días"), r = $("div", "row"); r.append(song);
  song.onclick = async () => {
    song.disabled = true;
    for (const [k, d] of DAYS.entries()) { cards[k].classList.add("hl"); await Voice.say(d.en); cards[k].classList.remove("hl"); }
    song.disabled = false; State.add(1);
  };
  root.append(g, r);
};

const quiz = root => multipleChoice(root, pick(DAYS, 5).map(d => ({ prompt: `¿Cómo se dice «${d.es}» en inglés?`, ...choicesFor(d, "en") })));

const listening = root => multipleChoice(root, pick(DAYS, 5).map(d => ({ prompt: "Escucha y elige el día en español", say: d.en, ...choicesFor(d, "es") })));

const trueFalse = root => multipleChoice(root, pick(DAYS, 6).map((d, i) => {
  const truth = Math.random() < .5, nxt = DAYS[(DAYS.indexOf(d) + 1) % 7];
  const other = pick(DAYS.filter(x => x !== d && x !== nxt), 1)[0];
  const opts = ["Verdadero ✅", "Falso ❌"];
  if (i % 2) return { prompt: `«${d.en}» significa «${(truth ? d : other).es}»`, say: d.en, options: opts, answer: truth ? 0 : 1 };
  return { prompt: `Después de ${d.en} viene ${(truth ? nxt : other).en}`, options: opts, answer: truth ? 0 : 1 };
}));

const matching = root => {
  const set = pick(DAYS, 5), right = shuffle(set), pairs = new Map(), lockedL = new Set(), lockedR = new Set();
  const colors = ["#ff5fa2", "#ffb52e", "#19c98d", "#38bdf8", "#a78bfa"];
  let cur = null;
  const msg = $("div", "msg");
  const lb = set.map((d, i) => { const b = $("button", "opt", `${d.icon} ${d.es}`); b.onclick = () => { if (lockedL.has(i)) return; Sound.click(); if (pairs.has(i)) { pairs.delete(i); cur = null; } else cur = i; paint(); }; return b; });
  const rb = right.map((d, j) => { const b = $("button", "opt", `🔊 ${d.en}`); b.onclick = () => {
    Voice.say(d.en); if (lockedR.has(j)) return;
    if (cur === null) { msg.textContent = "👈 Primero toca un día en español"; return; }
    for (const [k, v] of pairs) if (v === j) pairs.delete(k);
    pairs.set(cur, j); cur = null; msg.textContent = ""; paint(); }; return b; });
  const paint = () => {
    lb.forEach((b, i) => { const on = pairs.has(i) && !lockedL.has(i); b.style.background = on ? colors[i] : ""; b.style.color = on ? "#fff" : ""; b.classList.toggle("sel", cur === i); b.classList.toggle("ok", lockedL.has(i)); });
    rb.forEach((b, j) => { const e = [...pairs].find(([, v]) => v === j), on = e && !lockedR.has(j); b.style.background = on ? colors[e[0]] : ""; b.style.color = on ? "#fff" : ""; b.classList.toggle("ok", lockedR.has(j)); });
  };
  const chk = $("button", "btn g", "✔️ Comprobar"), r = $("div", "row"); r.append(chk);
  chk.onclick = () => {
    if (!pairs.size) { msg.textContent = "🔗 Une al menos una pareja"; return; }
    let bad = 0;
    for (const [i, j] of [...pairs]) {
      if (set[i] === right[j]) { lockedL.add(i); lockedR.add(j); } else { bad++; pairs.delete(i); rb[j].classList.add("no"); setTimeout(() => rb[j].classList.remove("no"), 600); }
    }
    paint();
    if (lockedL.size === set.length) { Sound.ok(); celebrate(box); return; }
    bad ? Sound.bad() : Sound.ok();
    msg.textContent = bad ? "💪 Algunas parejas no son correctas. ¡Inténtalo otra vez!" : "🎉 ¡Muy bien! Sigue uniendo";
  };
  const box = $("div"), cols = $("div", "two"), L = $("div", "col"), R = $("div", "col");
  L.append(...lb); R.append(...rb); cols.append(L, R); box.append(cols, r, msg); root.append(box);
};

const scramble = root => {
  const words = pick(DAYS, 4), box = $("div"), msg = $("div", "msg");
  let n = 0, letters = [], built = [], solved = false;
  const start = () => {
    const w = words[n].en.toUpperCase();
    do { letters = shuffle([...w]); } while (letters.join("") === w);
    built = []; solved = false; msg.textContent = ""; draw();
  };
  const draw = () => {
    const d = words[n]; box.innerHTML = "";
    box.append($("div", "how", `Palabra ${n + 1} de ${words.length}: forma el día «${d.es}» ${d.icon}`));
    const ans = $("div", "row"), pool = $("div", "row");
    built.forEach(k => { const b = $("button", "tile on", letters[k]); b.onclick = () => { if (solved) return; built = built.filter(x => x !== k); Sound.click(); draw(); }; ans.append(b); });
    if (!built.length) ans.append($("span", "ph", "Toca las letras de abajo 👇"));
    letters.forEach((ch, k) => { if (built.includes(k)) return; const b = $("button", "tile", ch); b.onclick = () => { if (solved) return; built.push(k); Sound.click(); draw(); }; pool.append(b); });
    const hear = $("button", "btn y", "🔊 Escuchar"), clr = $("button", "btn", "🧹 Borrar"), chk = $("button", "btn g", solved ? "➡️ Siguiente" : "✔️ Comprobar"), r = $("div", "row");
    hear.onclick = () => Voice.say(d.en);
    clr.onclick = () => { if (solved) return; built = []; msg.textContent = ""; draw(); };
    chk.onclick = () => {
      if (solved) { if (n < words.length - 1) { n++; start(); } else celebrate(box); return; }
      if (built.length < letters.length) { msg.textContent = "🔤 Faltan letras"; return; }
      if (built.map(k => letters[k]).join("") === d.en.toUpperCase()) { solved = true; Sound.ok(); State.add(1); msg.textContent = "🎉 ¡Excelente!"; draw(); }
      else { Sound.bad(); ans.classList.add("shake"); msg.textContent = "💪 ¡Casi! Revisa el orden"; setTimeout(() => ans.classList.remove("shake"), 500); }
    };
    r.append(hear, clr, chk); box.append(ans, pool, r);
  };
  root.append(box, msg); start();
};

function makeGrid(words, size = 10) {
  const sorted = [...words].sort((a, b) => b.length - a.length);
  for (;;) {
    const g = Array.from({ length: size }, () => Array(size).fill(""));
    let ok = true;
    for (const w of sorted) {
      let placed = false;
      for (let t = 0; t < 300 && !placed; t++) {
        const v = Math.random() < .5;
        const r = Math.random() * (v ? size - w.length + 1 : size) | 0, c = Math.random() * (v ? size : size - w.length + 1) | 0;
        const cells = [...w].map((_, k) => v ? [r + k, c] : [r, c + k]);
        if (cells.every(([y, x]) => !g[y][x])) { cells.forEach(([y, x], k) => { g[y][x] = w[k]; }); placed = true; }
      }
      if (!placed) { ok = false; break; }
    }
    if (ok) { const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"; return g.flat().map(ch => ch || A[Math.random() * 26 | 0]); }
  }
}

const wordSearch = root => {
  const S = 10, words = DAYS.map(d => d.en.toUpperCase()), flat = makeGrid(words, S), found = new Set();
  const colors = ["#ff5fa2", "#ff9f1c", "#19c98d", "#38bdf8", "#a78bfa", "#ef476f", "#06a77d"];
  let a = null, b = null;
  const chips = $("div", "chips"), chipEls = words.map(w => $("span", "chip", w));
  chips.append(...chipEls);
  const seg = () => {
    if (a === null) return [];
    if (b === null) return [a];
    const [y1, x1, y2, x2] = [a / S | 0, a % S, b / S | 0, b % S], out = [];
    if (y1 === y2) for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) out.push(y1 * S + x);
    else for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) out.push(y * S + x1);
    return out;
  };
  const board = $("div", "ws"), msg = $("div", "msg");
  const cells = flat.map((ch, i) => {
    const el = $("button", "", ch);
    el.onclick = () => {
      Sound.click();
      if (a === null || b !== null) { a = i; b = null; }
      else if (Math.floor(a / S) === Math.floor(i / S) || a % S === i % S) b = i; else a = i;
      paint();
    };
    return el;
  });
  board.append(...cells);
  const paint = () => { const s = seg(); cells.forEach((c, i) => c.classList.toggle("s", s.includes(i))); };
  const chk = $("button", "btn g", "✔️ Comprobar palabra"), r = $("div", "row"); r.append(chk);
  chk.onclick = () => {
    const s = seg(), w = s.map(i => flat[i]).join("");
    if (s.length < 2) { msg.textContent = "👆 Toca la primera y la última letra de la palabra"; return; }
    if (words.includes(w) && !found.has(w)) {
      const k = words.indexOf(w); found.add(w); Sound.ok(); State.add(1);
      s.forEach(i => { cells[i].classList.add("fd"); cells[i].style.background = colors[k]; });
      chipEls[k].classList.add("done"); msg.textContent = `🎉 ¡Encontraste ${w}!`; Voice.say(w.toLowerCase());
      a = b = null; paint();
      if (found.size === words.length) setTimeout(() => celebrate(wrap), 1200);
    } else { Sound.bad(); msg.textContent = "🔍 Esa no es una palabra de la lista. ¡Sigue buscando!"; a = b = null; paint(); }
  };
  const wrap = $("div"); wrap.append(chips, board, r, msg); root.append(wrap);
};

const memory = root => {
  const set = pick(DAYS, 6), cards = shuffle(set.flatMap(d => [{ d, t: d.en, en: true }, { d, t: d.es, en: false }]));
  let open = [], matched = 0, moves = 0, lock = false;
  const grid = $("div", "mgrid"), msg = $("div", "msg", "Movimientos: 0"), wrap = $("div");
  cards.forEach(c => {
    const el = $("button", "mem", `<div class="in"><div class="face fr">❓</div><div class="face bk"><span>${c.d.icon}</span>${c.t}</div></div>`);
    el.onclick = () => {
      if (lock || el.classList.contains("f")) return;
      el.classList.add("f"); Sound.click(); if (c.en) Voice.say(c.t);
      open.push([c, el]);
      if (open.length < 2) return;
      const [[x, ex], [y, ey]] = open; open = []; moves++; msg.textContent = `Movimientos: ${moves}`;
      if (x.d === y.d) { matched++; ex.classList.add("m"); ey.classList.add("m"); Sound.ok(); if (matched === set.length) setTimeout(() => celebrate(wrap), 1200); }
      else { lock = true; Sound.bad(); setTimeout(() => { ex.classList.remove("f"); ey.classList.remove("f"); lock = false; }, 1000); }
    };
    grid.append(el);
  });
  wrap.append(grid, msg); root.append(wrap);
};

const popsicle = root => {
  const words = pick(DAYS, 3), LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ", MAX = 6;
  const stage = $("div", "stage", POP + '<div class="hot"></div>'), area = $("div"), msg = $("div", "msg");
  let n = 0, m = 0, used = new Set(), over = false;
  const wrap = $("div");
  const start = () => { m = 0; used = new Set(); over = false; msg.textContent = ""; stage.classList.remove("win", "lost"); stage.style.setProperty("--m", 0); stage.dataset.mood = "happy"; draw(); };
  const draw = () => {
    const d = words[n], w = d.en.toUpperCase(); area.innerHTML = "";
    const clue = $("div", "how", `Pista: ${d.icon} <b>${d.es}</b><br>Adivina la palabra en inglés antes de que se derrita la paleta. ¡Tienes ${MAX} errores!`);
    const hear = $("button", "btn y", "🔊 Pista sonora"); hear.onclick = () => Voice.say(d.en);
    const slots = $("div", "row slots"); [...w].forEach(ch => slots.append($("span", "", used.has(ch) ? ch : "")));
    const kb = $("div", "kb");
    [...LETTERS].forEach(ch => {
      const b = $("button", "opt" + (used.has(ch) ? (w.includes(ch) ? " ok" : " no") : ""), ch);
      b.disabled = over || used.has(ch); b.onclick = () => guess(ch); kb.append(b);
    });
    const r = $("div", "row"); r.append(hear);
    if (over) { const nx = $("button", "btn g", m >= MAX ? "🔄 Intentar otra vez" : (n < words.length - 1 ? "➡️ Siguiente paleta" : "🏆 ¡Terminé!")); nx.onclick = () => { if (m >= MAX) start(); else if (n < words.length - 1) { n++; start(); } else celebrate(wrap); }; r.append(nx); }
    area.append(clue, slots, kb, r);
  };
  const guess = ch => {
    const w = words[n].en.toUpperCase(); used.add(ch);
    if (w.includes(ch)) Sound.ok();
    else { m++; Sound.bad(); Sound.drip(); stage.classList.add("shake"); setTimeout(() => stage.classList.remove("shake"), 450); }
    stage.style.setProperty("--m", m);
    stage.dataset.mood = m >= MAX ? "sad" : m >= 4 ? "scared" : m >= 2 ? "worry" : "happy";
    if ([...w].every(c => used.has(c))) { over = true; stage.classList.add("win"); stage.dataset.mood = "win"; fireworks(stage); msg.textContent = "🍭 ¡Salvaste la paleta! 🎉"; State.add(2); Sound.win(); confetti(); }
    else if (m >= MAX) { over = true; stage.classList.add("lost"); msg.textContent = "😢 ¡La paleta se derritió! Inténtalo otra vez"; }
    draw();
  };
  wrap.append(stage, msg, area); root.append(wrap); start();
};

const finale = (root, app) => {
  const names = ["Pequeño explorador", "Gran aprendiz", "Campeón del inglés"];
  root.append($("div", "final", `<h2>🏆 ¡Felicidades, campeón! 🏆</h2><p style="font-size:1.2rem">¡Aprendiste los días de la semana en inglés!<br>Repite en voz alta: <b>Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday</b> 🎤</p><div class="stars">⭐ ${State.score} puntos ⭐</div><p style="font-size:1.3rem">Eres: <b>${names[Math.min(2, State.score / 12 | 0)]}</b></p>`));
  const row = $("div", "row"), again = $("button", "btn y", "🔁 Jugar de nuevo"), say = $("button", "btn g", "🔊 Escuchar los días");
  again.onclick = () => app.go(0); say.onclick = async () => { for (const d of DAYS) await Voice.say(d.en); };
  row.append(say, again); root.append(row); Sound.win(); confetti();
};

/* ===== Aplicación (navegación) ===== */
const App = {
  i: 0, tabs: [],
  init() {
    const nav = document.getElementById("nav");
    this.tabs = SECTIONS.map((s, k) => {
      const t = $("button", "tab", `<b>${s.icon}</b><small>${s.title}</small>`);
      t.onclick = () => this.go(k); nav.append(t); return t;
    });
    const sky = document.getElementById("sky");
    ["☀️","🍭","🌴","🍉","🐠","🏖️","🍦","🌈"].forEach((e, k) => {
      const f = $("i", "", e); f.style.cssText = `left:${k * 12.5 + Math.random() * 6}%;font-size:${24 + Math.random() * 22}px;animation-duration:${14 + Math.random() * 14}s;animation-delay:${-Math.random() * 20}s`; sky.append(f);
    });
    this.go(0);
  },
  go(i) {
    this.i = i; Sound.click();
    const main = document.getElementById("main"), s = SECTIONS[i], card = $("section", "card");
    main.innerHTML = "";
    card.append($("h2", "", `${s.icon} ${s.title}`), $("div", "how", s.how));
    s.mount(card, this);
    const prev = $("button", "btn", "⬅️ Anterior"), next = $("button", "btn y", "Siguiente ➡️"), foot = $("div", "foot");
    prev.disabled = i === 0; next.disabled = i === SECTIONS.length - 1;
    prev.onclick = () => this.go(i - 1); next.onclick = () => this.go(i + 1);
    foot.append(prev, next); main.append(card, foot);
    this.tabs.forEach((t, k) => t.classList.toggle("on", k === i));
    this.tabs[i].scrollIntoView({ block: "nearest", inline: "center" });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
};
